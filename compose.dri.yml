# Hardware OpenGL through the host GPU (Intel/AMD, or NVIDIA with the open Mesa driver).
# Added by scripts/gui.sh when /dev/dri exists; without it Webots, rqt and RViz render in software.
services:
  simulator:
    devices:
      - /dev/dri:/dev/dri
    # Group owning /dev/dri/renderD128 on the host (render, or video on older systems).
    group_add:
      - "${DRI_GID:-44}"
  gui:
    devices:
      - /dev/dri:/dev/dri
    group_add:
      - "${DRI_GID:-44}"
