# Базовый Nav2 из ware_ws: Navfn A* + Regulated Pure Pursuit.
# Этот профиль интегрирует G5; он не выдаёт Nav2 за выполненные методы групп G1–G4.
amcl:
  ros__parameters:
    use_sim_time: true
    base_frame_id: base_link
    odom_frame_id: odom
    global_frame_id: map
    scan_topic: sensors/scan
    robot_model_type: nav2_amcl::DifferentialMotionModel
    alpha1: 0.02
    alpha2: 0.02
    alpha3: 0.02
    alpha4: 0.02
    alpha5: 0.02
    min_particles: 300
    max_particles: 1000
    max_beams: 120
    laser_model_type: likelihood_field
    laser_min_range: 0.05
    laser_max_range: 12.0
    laser_likelihood_max_dist: 2.0
    z_hit: 0.95
    z_rand: 0.05
    sigma_hit: 0.1
    update_min_d: 0.01
    update_min_a: 0.01
    resample_interval: 1
    transform_tolerance: 0.2
    tf_broadcast: true
    set_initial_pose: true
    always_reset_initial_pose: true
    initial_pose: {x: -3.0, y: 0.0, z: 0.0, yaw: 0.0}

map_server:
  ros__parameters:
    use_sim_time: true
    frame_id: map
    topic_name: map

planner_server:
  ros__parameters:
    use_sim_time: true
    expected_planner_frequency: 1.0
    planner_plugins: [GridBased]
    GridBased:
      plugin: nav2_navfn_planner::NavfnPlanner
      tolerance: 0.20
      use_astar: true
      allow_unknown: false

controller_server:
  ros__parameters:
    use_sim_time: true
    controller_frequency: 20.0
    enable_stamped_cmd_vel: false
    odom_topic: state/odom
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.001
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.3
    costmap_update_timeout: 0.3
    progress_checker_plugins: [progress]
    goal_checker_plugins: [goal]
    controller_plugins: [FollowPath]
    progress:
      plugin: nav2_controller::PoseProgressChecker
      required_movement_radius: 0.1
      required_movement_angle: 0.3
      movement_time_allowance: 15.0
    goal:
      plugin: nav2_controller::StoppedGoalChecker
      xy_goal_tolerance: 0.20
      yaw_goal_tolerance: 0.20
      trans_stopped_velocity: 0.05
      rot_stopped_velocity: 0.10
      stateful: true
    FollowPath:
      plugin: nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController
      desired_linear_vel: 0.35
      lookahead_dist: 0.6
      use_velocity_scaled_lookahead_dist: false
      use_rotate_to_heading: true
      rotate_to_heading_angular_vel: 0.6
      rotate_to_heading_min_angle: 0.6
      max_angular_accel: 1.5
      transform_tolerance: 0.2
      use_collision_detection: true
      max_allowed_time_to_collision_up_to_carrot: 1.0
      use_regulated_linear_velocity_scaling: true
      use_cost_regulated_linear_velocity_scaling: true
      regulated_linear_scaling_min_radius: 0.9
      regulated_linear_scaling_min_speed: 0.10
      min_approach_linear_velocity: 0.05
      approach_velocity_scaling_dist: 0.6
      allow_reversing: false

local_costmap:
  local_costmap:
    ros__parameters:
      use_sim_time: true
      global_frame: odom
      robot_base_frame: base_link
      rolling_window: true
      width: 6
      height: 6
      resolution: 0.05
      update_frequency: 10.0
      publish_frequency: 5.0
      transform_tolerance: 0.2
      robot_radius: 0.28
      always_send_full_costmap: true
      plugins: [obstacles, inflation]
      obstacles:
        plugin: nav2_costmap_2d::ObstacleLayer
        observation_sources: scan
        scan:
          # Costmap имеет вложенный namespace; это общий sensor contract одного робота.
          topic: /sensors/scan
          data_type: LaserScan
          marking: true
          clearing: true
          obstacle_max_range: 10.0
          raytrace_max_range: 12.0
          max_obstacle_height: 1.0
          inf_is_valid: true
      inflation:
        plugin: nav2_costmap_2d::InflationLayer
        inflation_radius: 0.50
        cost_scaling_factor: 3.0

global_costmap:
  global_costmap:
    ros__parameters:
      use_sim_time: true
      global_frame: map
      robot_base_frame: base_link
      resolution: 0.05
      update_frequency: 5.0
      publish_frequency: 2.0
      transform_tolerance: 0.2
      robot_radius: 0.28
      track_unknown_space: true
      plugins: [static, obstacles, inflation]
      static:
        plugin: nav2_costmap_2d::StaticLayer
        map_subscribe_transient_local: true
      obstacles:
        plugin: nav2_costmap_2d::ObstacleLayer
        observation_sources: scan
        scan:
          topic: /sensors/scan
          data_type: LaserScan
          marking: true
          clearing: true
          obstacle_max_range: 10.0
          raytrace_max_range: 12.0
          max_obstacle_height: 1.0
          inf_is_valid: true
      inflation:
        plugin: nav2_costmap_2d::InflationLayer
        inflation_radius: 0.50
        cost_scaling_factor: 3.0

nav2_contracts:
  ros__parameters:
    use_sim_time: true
    base_frame: base_link
    grid_frame: odom
    grid_size: 8.0
    grid_resolution: 0.05
    max_input_age: 0.3
