scenario_lower_bound_reason: Swapping two robots between (-3,-3) and (3,-3) needs
  12 horizontal actions. To exchange order without intersection, at least one must
  leave and return to y=-3, requiring at least two vertical actions. Feasible recorded
  cost 14 attains this lower bound. Stationary pickup plans cost 0.
assignment_cost_reason: Each batch has one pickup at each robot current station. The
  opposite pickup is six free horizontal grid edges away; both zero-cost local pickups
  give the nonnegative-cost optimum 0.
